<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC検定 3級 模擬試験</title>
    <style>
        :root {
            --primary-color: #1a2a44;
            --accent-color: #c5a059;
            --bg-color: #f9f9f9;
            --text-color: #333;
            --white: #ffffff;
            --correct-color: #2e7d32;
            --wrong-color: #c62828;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--white);
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
        }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.4s ease;
        }

        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 10px;
        }

        .btn-primary { background-color: var(--primary-color); color: var(--white); }
        .btn-secondary { background-color: var(--white); color: var(--primary-color); border: 2px solid var(--primary-color); }
        .btn-exam {
            background-color: #f0f4f8;
            color: var(--primary-color);
            border: 1px solid #dce4ec;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Quiz UI */
        .progress-bar-container {
            width: 100%; height: 6px; background-color: #eee; border-radius: 3px; margin-bottom: 20px;
        }
        .progress-bar {
            height: 100%; background-color: var(--accent-color); width: 0%; transition: width 0.3s ease;
        }

        .question-meta { font-size: 0.9rem; color: #666; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .question-text { font-size: 1.1rem; line-height: 1.6; font-weight: 600; margin-bottom: 20px; white-space: pre-wrap; }
        
        .choice-btn {
            background-color: var(--white);
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: var(--border-radius);
            text-align: left;
            font-size: 1rem;
            color: var(--text-color);
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .choice-btn.selected { background-color: #f0f4f8; border-color: var(--primary-color); color: var(--primary-color); font-weight: bold; }
        .choice-btn.correct { background-color: #e8f5e9; border-color: var(--correct-color); color: var(--correct-color); }
        .choice-btn.wrong { background-color: #ffebee; border-color: var(--wrong-color); color: var(--wrong-color); }

        /* Group Question Styles */
        .group-choices-list {
            background: #f0f8ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #cce5ff;
            font-size: 0.95rem;
            line-height: 1.8;
        }
        .group-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #eee;
        }
        .group-label { font-weight: bold; margin-bottom: 8px; display: block; color: var(--primary-color); }
        .group-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            background: white;
        }
        .group-feedback {
            margin-top: 8px;
            font-size: 0.9rem;
            padding: 8px;
            border-radius: 4px;
            display: none;
        }
        .group-feedback.show-correct { display: block; background: #e8f5e9; color: var(--correct-color); }
        .group-feedback.show-wrong { display: block; background: #ffebee; color: var(--wrong-color); }

        /* Feedback Area */
        .feedback-area {
            background-color: #f8f9fa;
            border-radius: var(--border-radius);
            padding: 20px;
            margin: 20px 0;
            display: none;
            border-left: 5px solid #ccc;
        }
        .feedback-area.correct { border-left-color: var(--correct-color); }
        .feedback-area.wrong { border-left-color: var(--wrong-color); }

        .action-area { display: flex; gap: 10px; margin-top: auto; padding-top: 20px; }

        /* Result Screen */
        .result-header {
            text-align: center; margin-bottom: 30px; padding: 30px 0;
            background: linear-gradient(135deg, var(--primary-color), #2c3e50);
            color: white; border-radius: var(--border-radius);
        }
        .score-display { font-size: 3rem; font-weight: bold; color: var(--accent-color); }
        .result-list { list-style: none; padding: 0; }
        .result-item {
            padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px;
            display: flex; align-items: center;
        }
        .result-item.correct-item { border-left: 4px solid var(--correct-color); }
        .result-item.wrong-item { border-left: 4px solid var(--wrong-color); }
        .result-icon { margin-right: 12px; font-weight: bold; }

    </style>
</head>
<body>

<div class="app-container">
    <header><h1>JC検定 3級対策</h1></header>

    <main>
        <div id="home-screen" class="screen active">
            <div class="home-content" style="text-align: center; margin-top: 20px;">
                <div class="logo-area">
                    <div class="logo-icon">💎</div>
                    <h2>過去問演習アプリ</h2>
                </div>
                
                <div id="step-exam" class="selector-area">
                    <p class="section-title">受験する回を選んでください</p>
                    <button class="btn btn-exam" onclick="selectExam('48')">第48回検定 (2024.8) <span>&gt;</span></button>
                    <button class="btn btn-exam" onclick="selectExam('47')">第47回検定 (2024.3) <span>&gt;</span></button>
                </div>

                <div id="step-mode" class="selector-area" style="display:none;">
                    <p class="section-title">モードを選んでください</p>
                    <button class="btn btn-primary" onclick="startApp('practice')">練習モード</button>
                    <button class="btn btn-secondary" onclick="startApp('test')">模擬テスト</button>
                    <button class="btn" style="background:none; color:#666;" onclick="resetSelection()">← 選び直す</button>
                </div>
            </div>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
            <div class="question-meta">
                <span>Question <span id="q-current">1</span></span>
                <span id="mode-badge">練習</span>
            </div>

            <div id="question-text" class="question-text"></div>
            
            <img id="question-image" class="question-image" src="" alt="問題画像" style="display:none;">

            <div id="choices-area"></div>

            <div id="feedback-area" class="feedback-area">
                <div id="feedback-title" style="font-weight:bold; font-size:1.2rem; margin-bottom:10px;"></div>
                <div id="explanation-text"></div>
            </div>

            <div class="action-area">
                <button id="prev-btn" class="btn btn-secondary" style="flex:1;" onclick="prevQuestion()">＜ 戻る</button>
                <button id="submit-btn" class="btn btn-primary" style="flex:2;" onclick="submitAnswer()">回答する</button>
                <button id="next-btn" class="btn btn-primary" style="display:none; flex:2;" onclick="nextQuestion()">次の問題へ</button>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <div class="result-header">
                <div>スコア</div>
                <div class="score-display"><span id="final-score">0</span> / <span id="total-count">0</span></div>
                <div id="score-message"></div>
            </div>
            <ul id="result-list" class="result-list"></ul>
            <div class="action-area">
                <button class="btn btn-primary" onclick="location.reload()">トップに戻る</button>
            </div>
        </div>
    </main>
</div>

<script src="quiz_data.js"></script>
<script>
    let currentExamId, currentQuizList, currentMode, currentIndex;
    let userAnswers = {}; 

    const homeScreen = document.getElementById('home-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');
    const prevBtn = document.getElementById('prev-btn');

    // --- Setup ---
    function selectExam(id) {
        if (!allQuizData[id] || allQuizData[id].length === 0) return alert("データがありません");
        currentExamId = id;
        currentQuizList = allQuizData[id];
        document.getElementById('step-exam').style.display = 'none';
        document.getElementById('step-mode').style.display = 'block';
    }

    function resetSelection() {
        document.getElementById('step-mode').style.display = 'none';
        document.getElementById('step-exam').style.display = 'block';
    }

    function startApp(mode) {
        currentMode = mode;
        currentIndex = 0;
        userAnswers = {};
        homeScreen.classList.remove('active');
        quizScreen.classList.add('active');
        document.getElementById('mode-badge').textContent = (mode === 'practice' ? '練習' : 'テスト');
        renderQuestion();
    }

    // --- Rendering ---
    function renderQuestion() {
        const q = currentQuizList[currentIndex];
        const answeredData = userAnswers[currentIndex];

        // Progress
        const progress = ((currentIndex) / currentQuizList.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
        document.getElementById('q-current').textContent = currentIndex + 1;

        // Reset UI
        document.getElementById('question-text').textContent = q.question;
        const container = document.getElementById('choices-area');
        container.innerHTML = '';
        document.getElementById('feedback-area').style.display = 'none';
        
        // ★★★ 画像表示ロジックの復活 ★★★
        const imgElement = document.getElementById('question-image');
        if (q.images) {
            imgElement.src = q.images;
            imgElement.style.display = 'block';
            imgElement.onclick = () => window.open(q.images, '_blank');
        } else {
            imgElement.style.display = 'none';
        }
        
        submitBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
        prevBtn.style.visibility = (currentIndex > 0) ? 'visible' : 'hidden';

        // Render based on Type
        if (q.type === 'group') {
            renderGroupQuestion(q, container, answeredData);
        } else {
            renderSingleQuestion(q, container, answeredData);
        }

        // Button State Logic
        if (currentMode === 'practice' && answeredData) {
            showFeedback(q, answeredData, true);
        } else if (currentMode === 'test') {
            submitBtn.textContent = (currentIndex === currentQuizList.length - 1) ? '終了' : '次へ';
            submitBtn.disabled = false; 
        } else {
            submitBtn.textContent = '回答する';
            if (q.type === 'group') {
                submitBtn.disabled = false; 
            } else {
                submitBtn.disabled = !answeredData; 
            }
        }
    }

    // Single Question Renderer
    function renderSingleQuestion(q, container, answeredData) {
        let selectedIdx = answeredData ? answeredData.selected : null;
        
        q.choices.forEach((choice, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = choice;
            if (selectedIdx === idx) btn.classList.add('selected');
            
            // Interaction
            if (!answeredData || currentMode === 'test') {
                btn.onclick = () => {
                    container.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    submitBtn.disabled = false; 
                };
            }
            container.appendChild(btn);
        });
    }

    // Group Question Renderer
    function renderGroupQuestion(q, container, answeredData) {
        // 解答群の表示
        const choicesList = document.createElement('div');
        choicesList.className = 'group-choices-list';
        choicesList.innerHTML = "<strong>【解答群】</strong><br>" + q.choices.join("　");
        container.appendChild(choicesList);

        q.sub_questions.forEach((sub, idx) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'group-item';
            
            const label = document.createElement('span');
            label.className = 'group-label';
            label.textContent = `[ ${sub.label} ] の回答`;
            wrapper.appendChild(label);

            const select = document.createElement('select');
            select.className = 'group-select';
            select.dataset.idx = idx;
            select.innerHTML = '<option value="">選択してください</option>';
            
            q.choices.forEach((c) => {
                const opt = document.createElement('option');
                opt.value = c.charAt(1); // "(a)..." -> "a"
                opt.textContent = c;
                select.appendChild(opt);
            });

            if (answeredData && answeredData.details[idx]) {
                select.value = answeredData.details[idx].selectedVal;
            }

            if (currentMode === 'practice' && answeredData) {
                select.disabled = true;
            }

            wrapper.appendChild(select);

            const fb = document.createElement('div');
            fb.className = 'group-feedback';
            fb.id = `group-fb-${idx}`;
            wrapper.appendChild(fb);

            container.appendChild(wrapper);
        });
    }

    // --- Logic ---
    function submitAnswer() {
        const q = currentQuizList[currentIndex];
        
        if (q.type === 'group') {
            // Group Validation
            const selects = document.querySelectorAll('.group-select');
            let details = [];
            let allCorrect = true;
            let isFilled = true;

            selects.forEach((sel, i) => {
                const val = sel.value;
                if (!val) isFilled = false;
                const correctVal = q.sub_questions[i].answer;
                const isCorrect = (val === correctVal);
                if (!isCorrect) allCorrect = false;
                details.push({ selectedVal: val, correct: isCorrect });
            });

            if (currentMode === 'practice' && !isFilled) {
                if(!confirm("未選択の項目があります。回答しますか？")) return;
            }

            userAnswers[currentIndex] = { type: 'group', correct: allCorrect, details: details };

        } else {
            // Single Validation
            const selectedBtn = document.querySelector('.choice-btn.selected');
            
            if (!selectedBtn) {
                if (currentMode === 'test') {
                    userAnswers[currentIndex] = { type: 'single', correct: false, selected: null, correctIdx: null };
                    nextQuestion();
                    return;
                } else {
                    return alert("選択肢を選んでください");
                }
            }

            const choices = Array.from(document.querySelectorAll('.choice-btn'));
            const selectedIdx = choices.indexOf(selectedBtn);
            const correctIdx = q.answer.toLowerCase().charCodeAt(0) - 97;
            const isCorrect = (selectedIdx === correctIdx);

            userAnswers[currentIndex] = { type: 'single', correct: isCorrect, selected: selectedIdx, correctIdx: correctIdx };
        }

        if (currentMode === 'practice') {
            showFeedback(q, userAnswers[currentIndex], false);
        } else {
            nextQuestion();
        }
    }

    function showFeedback(q, ansData, isRestoring) {
        const fbArea = document.getElementById('feedback-area');
        const fbTitle = document.getElementById('feedback-title');
        const fbText = document.getElementById('explanation-text');
        
        fbArea.style.display = 'block';
        
        if (q.type === 'group') {
            let correctCount = ansData.details.filter(d => d.correct).length;
            let total = ansData.details.length;
            
            if (correctCount === total) {
                fbArea.className = 'feedback-area correct';
                fbTitle.innerHTML = '全問正解！素晴らしい！';
            } else {
                fbArea.className = 'feedback-area wrong';
                fbTitle.innerHTML = `${correctCount} / ${total} 正解`;
            }

            ansData.details.forEach((d, i) => {
                const fbBox = document.getElementById(`group-fb-${i}`);
                const subQ = q.sub_questions[i];
                if (d.correct) {
                    fbBox.className = 'group-feedback show-correct';
                    fbBox.innerHTML = `⭕ 正解！<br>${subQ.explanation}`;
                } else {
                    fbBox.className = 'group-feedback show-wrong';
                    fbBox.innerHTML = `❌ 不正解 (正解: ${subQ.answer})<br>${subQ.explanation}`;
                }
            });
            fbText.textContent = ""; 

        } else {
            const btns = document.querySelectorAll('.choice-btn');
            btns.forEach(b => b.disabled = true);
            
            if (btns[ansData.correctIdx]) btns[ansData.correctIdx].classList.add('correct');
            if (!ansData.correct && btns[ansData.selected]) btns[ansData.selected].classList.add('wrong');

            if (ansData.correct) {
                fbArea.className = 'feedback-area correct';
                fbTitle.innerHTML = '⭕ 正解！';
            } else {
                fbArea.className = 'feedback-area wrong';
                fbTitle.innerHTML = '❌ 不正解...';
            }
            fbText.textContent = q.explanation;
        }

        submitBtn.style.display = 'none';
        nextBtn.style.display = 'inline-block';

        if (!isRestoring) fbArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuizList.length) {
            renderQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');

        let totalScore = 0;
        let totalMax = 0;
        const list = document.getElementById('result-list');
        list.innerHTML = '';

        currentQuizList.forEach((q, i) => {
            const ans = userAnswers[i];
            const li = document.createElement('li');
            li.className = 'result-item';
            
            if (q.type === 'group') {
                const subTotal = q.sub_questions.length;
                const subCorrect = ans ? ans.details.filter(d => d.correct).length : 0;
                totalScore += subCorrect;
                totalMax += subTotal;

                li.innerHTML = `
                    <div style="flex:1;">
                        <div style="font-weight:bold; color:#666;">問${q.question_no} (複合問題)</div>
                        <div style="font-size:0.9rem;">結果: ${subCorrect} / ${subTotal} 正解</div>
                    </div>
                `;
                if (subCorrect === subTotal) li.classList.add('correct-item');
                else li.classList.add('wrong-item');

            } else {
                totalMax++;
                const isCorrect = ans ? ans.correct : false;
                if (isCorrect) totalScore++;

                li.innerHTML = `
                    <div class="result-icon">${isCorrect ? '⭕' : '❌'}</div>
                    <div style="flex:1;">
                        <div style="font-weight:bold; color:#666;">問${q.question_no}</div>
                        <div style="font-size:0.9rem;">${q.question.split('\n')[0].substring(0, 30)}...</div>
                    </div>
                `;
                li.classList.add(isCorrect ? 'correct-item' : 'wrong-item');
            }
            list.appendChild(li);
        });

        document.getElementById('final-score').textContent = totalScore;
        document.getElementById('total-count').textContent = totalMax;
    }
</script>
</body>
</html>
